name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          cmdline-tools-version: latest

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor Packages
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Build Production Bundle
        run: npm run build

      - name: Create Capacitor Config
        run: |
          cat << EOF > capacitor.config.json
          {
            "appId": "com.yuganova.nova",
            "appName": "Nova",
            "webDir": "dist"
          }
          EOF

      - name: Add Android Platform
        run: npx cap add android

      - name: Build Android App (Capacitor/Cordova Example)
        run: npx cap sync android

      # Automatically appends a resolution strategy to fix Kotlin duplicate class conflicts during build
      - name: Fix Kotlin Version Conflicts in Gradle
        run: |
          echo "
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }" >> android/app/build.gradle

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
