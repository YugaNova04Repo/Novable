name: Build Android App

on:
  push:
    branches: [ "main" ] # Or your default branch
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Adjust to your project's required Node version
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      # Explicitly install Capacitor CLI and Android platform if missing from node_modules
      - name: Ensure Capacitor CLI is Installed
        run: npm install --save-dev @capacitor/cli @capacitor/android

      - name: Build Production Bundle
        run: npm run build # Adjust if your build script has a different name

      - name: Build Android App (Capacitor/Cordova Example)
        run: npx cap sync android

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk # Update path if building a release bundle (.aab)
