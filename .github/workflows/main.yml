name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure Capacitor CLI is Installed
        run: npm install --save-dev @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Build Production Bundle
        run: npm run build

      # Added step to initialize the Android platform in the CI environment
      - name: Add Android Platform
        run: npx cap add android

      - name: Build Android App (Capacitor/Cordova Example)
        run: npx cap sync android

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
